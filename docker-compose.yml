version: '3'

services:
  web:
    build:
      context: .
      dockerfile: docker/apache/Dockerfile
      args:
        TIMEZONE: ${TIMEZONE:-Europe/Paris}
    volumes:
      - .:/var/www/wpe:rw
      # Optional: log mapping
      # - ./var/log/apache2:/var/log/apache2
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-15}&charset=utf8"
    depends_on:
      - database

  api:
    image: node:22-alpine
    working_dir: /srv
    volumes:
      - ./backend:/srv
      - ./config:/srv/wpe-config:ro
    command: sh -c "npm install && node src/index.js"
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      SYMFONY_PROXY_TARGET: "http://web:80"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-15}&charset=utf8"
      AI_PERSONAS_JSON_PATH: /srv/wpe-config/ai_personas.json
    depends_on:
      - web
      - database

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-15}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    volumes:
      - database_data:/var/lib/postgresql/data:rw
###< doctrine/doctrine-bundle ###

volumes:
###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
